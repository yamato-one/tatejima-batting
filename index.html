<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>タテジマバッティング</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== 基本設定（縦向き） =====
const W = 400, H = 700;
const HOME = { x: 200, y: 615 };
const MOUND = { x: 200, y: 380 };
const BALL_FROM = { x: 204, y: 352 }, BALL_TO = { x: 196, y: 560 };

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
addEventListener('resize', fit); fit();

let best = 0;
try { best = +localStorage.getItem('tatejima-best') || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('tatejima-best', best); } catch (e) {} }

const rand = (a, b) => a + Math.random() * (b - a);
const now = () => performance.now();

// ===== 球場（ゲームごとにランダム） =====
const STADIUMS = ['night', 'dote', 'dome', 'major'];
const STADIUM_NAME = { night: 'ナイター', dote: '河川敷の土手', dome: 'ドーム', major: 'メジャー風の球場' };
let stadium, crowd;
function pickStadium() {
  stadium = STADIUMS[Math.floor(Math.random() * STADIUMS.length)];
  crowd = [];
  for (let i = 0; i < 260; i++) crowd.push({ x: rand(0, W), y: rand(0, 1), c: Math.random() });
}

// ===== 球種 =====
// dur: 投げてからベースに届くまで(ms)の幅（毎回この間でばらつく）
// curve: 横に曲がる幅（＋はバッターから逃げる、−はバッターに食い込む）  drop: 最後に落ちる幅
const PITCHES = {
  straight: { name: 'ストレート', dur: [780, 950], curve: 0, drop: 0 },
  fast:     { name: 'ストレート', dur: [620, 720], curve: 0, drop: 0 },
  curve:    { name: 'カーブ', dur: [1000, 1400], curve: 45, drop: 12 },
  shoot:    { name: 'シュート', dur: [740, 880], curve: -32, drop: 4 },
  fork:     { name: 'フォーク', dur: [880, 1050], curve: 0, drop: 38 },
  change:   { name: 'チェンジアップ', dur: [1050, 1250], curve: 0, drop: 12 },
};
// ボールをとらえる瞬間は、ベースに届く少し手前（届くまでの時間の92%のところ）
const MEET = 0.92;
function choosePitch() {
  // 投げた球数が増えるほど、速い球と変化球が増える
  const lv = Math.min(6, Math.floor(pitchNo / 3));
  const w = { straight: Math.max(1, 5 - lv), fast: 1 + lv, curve: 1 + lv * 0.4, shoot: 1 + lv * 0.4,
              fork: lv >= 1 ? lv * 0.6 : 0, change: lv >= 2 ? lv * 0.5 : 0 };
  let sum = 0; for (const k in w) sum += w[k];
  let r = Math.random() * sum;
  for (const k in w) { r -= w[k]; if (r <= 0) {
    const p = { ...PITCHES[k] };
    p.dur = Math.round(rand(p.dur[0], p.dur[1]) * (1 - lv * 0.04));
    p.kmh = Math.round(105 + (1300 - p.dur) * 50 / 700);
    // ボール球：ストライクゾーンの外へ投げる。振ったら空振り、見送ればボール
    p.bx = 0; p.by = 0; p.isBall = Math.random() < 0.3;
    if (p.isBall) {
      const side = Math.floor(Math.random() * 4);
      if (side === 0) p.bx = 90 - p.curve;        // 外角に大きくはずれる
      else if (side === 1) p.bx = -75 - p.curve;  // 内角（体の近く）
      else if (side === 2) p.by = 65;             // 低め（ワンバウンド気味）
      else p.by = -65;                            // 高め
    }
    return p;
  } }
  return { ...PITCHES.straight, dur: 900, kmh: 130, bx: 0, by: 0, isBall: false };
}

// ===== 状態 =====
// title / windup / pitch / result / over
let state = 'title', t = 0;
let score = 0, outs = 0, strikes = 0, balls = 0, bases = [false, false, false], pitchNo = 0, pitch, pitchAt, swung, swingAt;
let msg, msgColor, subMsg, resultAt, flight, particles = [], flashAt;
function newGame() {
  pickStadium();
  score = 0; outs = 0; strikes = 0; balls = 0; bases = [false, false, false]; pitchNo = 0;
  particles = []; flight = null;
  startWindup();
}
function startWindup() {
  state = 'windup'; pitchAt = now() + 700; pitch = choosePitch(); swung = false; swingAt = 0;
  msg = ''; subMsg = ''; flight = null;
}
pickStadium();

// ===== 操作 =====
function tap() {
  if (state === 'title') { newGame(); return; }
  if (state === 'over') { if (now() - resultAt > 800) newGame(); return; }
  if ((state === 'pitch' || state === 'windup') && !swung) swing();
}
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) tap(); }
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });

// ===== スイングの判定 =====
function swing() {
  swung = true; swingAt = now();
  if (state === 'windup') { strike('空振り', 'はやい！'); return; }
  const e = swingAt - (pitchAt + pitch.dur * MEET);   // マイナス＝早い、プラス＝遅い
  const a = Math.abs(e);
  const hint = e < 0 ? 'ちょっと早い' : 'ちょっと遅い';
  if (pitch.isBall) {   // ボール球に手を出した：うまく合ってもファウルどまり
    if (a <= 70) foul('ボール球だった…');
    else strike('空振り', 'ボール球だよ');
    return;
  }
  if (a <= 20) hit(4);
  else if (a <= 42) hit(2);
  else if (a <= 70) hit(1);
  else if (a <= 110) foul(hint);
  else strike('空振り', e < 0 ? 'はやい！' : 'おそい！');
}

function hit(n) {
  pitchNo++;
  const names = { 1: 'ヒット！', 2: 'ツーベース！', 4: 'ホームラン！' };
  const colors = { 1: '#ffffff', 2: '#ffe066', 4: '#ffd400' };
  let runs = 0;
  if (n === 4) { runs = 1 + bases.filter(Boolean).length; bases = [false, false, false]; }
  else {
    const nb = [false, false, false];
    for (let i = 2; i >= 0; i--) if (bases[i]) { const to = i + n; if (to >= 3) runs++; else nb[to] = true; }
    nb[n - 1] = true; bases = nb;
  }
  score += runs;
  strikes = 0; balls = 0;
  const dir = rand(-1, 1);
  flight = { kind: n === 4 ? 'hr' : 'hit', dir, at: now(), ...impactPos() };
  if (n === 4) { flashAt = now(); for (let i = 0; i < 4; i++) setTimeout(firework, i * 250); }
  showResult(names[n], colors[n], runs ? `${runs}点！` : '');
}
function impactPos() {
  const b = ballPos((swingAt - pitchAt) / pitch.dur);
  return { sx: b.x, sy: b.y };
}
function foul(hint) {
  pitchNo++;
  if (strikes < 2) strikes++;
  flight = { kind: 'foul', dir: Math.random() < 0.5 ? -1 : 1, at: now(), ...impactPos() };
  showResult('ファウル', '#cfe8ff', hint);
}
function strike(label, hint) {
  pitchNo++;
  strikes++;
  let m = label;
  if (strikes >= 3) { outs++; strikes = 0; balls = 0; m = label === '見逃し' ? '見逃し三振' : '空振り三振'; }
  showResult(m, '#ff8a8a', hint);
}
function ball() {
  pitchNo++;
  balls++;
  if (balls < 4) { showResult('ボール', '#9fe39f', 'よく見た！'); return; }
  // フォアボール：押し出しで塁が詰まる
  balls = 0; strikes = 0;
  let runs = 0;
  if (!bases[0]) bases[0] = true;
  else if (!bases[1]) bases[1] = true;
  else if (!bases[2]) bases[2] = true;
  else runs = 1;
  score += runs;
  showResult('フォアボール', '#9fe39f', runs ? '押し出しで1点！' : '一塁へ');
}
function showResult(m, color, sub) {
  state = 'result'; msg = m; msgColor = color; subMsg = sub; resultAt = now();
}

// ===== 花火 =====
function firework() {
  const cx = rand(60, 340), cy = rand(60, 180);
  const hue = [48, 0, 200, 120][Math.floor(Math.random() * 4)];
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(60, 170);
    particles.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1.2, hue });
  }
}

// ===== 更新 =====
function update(dt) {
  t += dt;
  const n = now();
  if (state === 'windup' && n >= pitchAt) state = 'pitch';
  if (state === 'pitch' && !swung && n > pitchAt + pitch.dur + 260) {
    swung = true;
    if (pitch.isBall) ball(); else strike('見逃し', 'ストライクだったよ');
  }
  if (state === 'result' && n - resultAt > 1500) {
    if (outs >= 3) { state = 'over'; resultAt = n; if (score > best) { best = score; saveBest(); } }
    else startWindup();
  }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
}

// ===== 描画：球場 =====
function drawStands(top, bottom, colors) {
  for (const c of crowd) {
    const y = top + c.y * (bottom - top);
    ctx.fillStyle = colors[Math.floor(c.c * colors.length)];
    ctx.fillRect(c.x, y, 3, 3);
  }
}
function drawBackground() {
  const FENCE = 232;
  if (stadium === 'night') {
    const g = ctx.createLinearGradient(0, 0, 0, FENCE);
    g.addColorStop(0, '#050b1f'); g.addColorStop(1, '#1b2c5a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, FENCE);
    // 照明塔
    for (const x of [40, 360]) {
      ctx.fillStyle = '#2a2f3a'; ctx.fillRect(x - 2, 20, 4, 110);
      ctx.fillStyle = '#fffbe0'; ctx.fillRect(x - 22, 14, 44, 16);
      const gl = ctx.createRadialGradient(x, 22, 4, x, 22, 90);
      gl.addColorStop(0, 'rgba(255,250,210,0.5)'); gl.addColorStop(1, 'rgba(255,250,210,0)');
      ctx.fillStyle = gl; ctx.fillRect(x - 90, 0, 180, 120);
    }
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 120, W, FENCE - 120);
    drawStands(122, FENCE - 20, ['#ffd400', '#ffd400', '#222', '#fff']);
    // ツタのフェンス
    ctx.fillStyle = '#244d22'; ctx.fillRect(0, FENCE - 18, W, 18);
    ctx.fillStyle = '#3f7a33';
    for (let x = 0; x < W; x += 7) ctx.fillRect(x + (x % 3), FENCE - 16 + (x % 5) * 3, 4, 4);
    return fieldColors('#2f8a3a', '#2b8134', '#3a2a20');
  }
  if (stadium === 'dote') {
    const g = ctx.createLinearGradient(0, 0, 0, FENCE);
    g.addColorStop(0, '#6db8ee'); g.addColorStop(1, '#cdeaf8');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, FENCE);
    // 遠くの家並み
    for (let i = 0; i < 12; i++) {
      const x = i * 36 - 6, h = 18 + (i * 7) % 22;
      ctx.fillStyle = ['#e8e2d6', '#c9d3db', '#efd9c3'][i % 3]; ctx.fillRect(x, 150 - h, 30, h);
      ctx.fillStyle = '#8a5a44'; ctx.fillRect(x - 2, 150 - h - 4, 34, 5);
    }
    // 鉄橋
    ctx.strokeStyle = '#b44'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 158); ctx.lineTo(W, 150); ctx.stroke();
    for (let x = 0; x < W; x += 30) { ctx.beginPath(); ctx.moveTo(x, 158 - x * 0.02); ctx.lineTo(x + 15, 146 - x * 0.02); ctx.lineTo(x + 30, 157 - x * 0.02); ctx.stroke(); }
    // 川
    ctx.fillStyle = '#4c8fc4'; ctx.fillRect(0, 160, W, 18);
    // 土手
    ctx.fillStyle = '#7cae4f';
    ctx.beginPath(); ctx.moveTo(0, 178); ctx.lineTo(W, 178); ctx.lineTo(W, FENCE); ctx.lineTo(0, FENCE); ctx.fill();
    ctx.fillStyle = '#d9c9a3'; ctx.fillRect(0, 176, W, 5);   // 土手の上の道
    // 緑のネット
    ctx.strokeStyle = 'rgba(40,90,40,0.6)'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 8) { ctx.beginPath(); ctx.moveTo(x, FENCE - 22); ctx.lineTo(x, FENCE); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(0, FENCE - 22); ctx.lineTo(W, FENCE - 22); ctx.stroke();
    return fieldColors('#6fa84a', '#669e43', '#b08a5a');
  }
  if (stadium === 'dome') {
    ctx.fillStyle = '#d9dde3'; ctx.fillRect(0, 0, W, FENCE);
    // 屋根の骨組み
    ctx.strokeStyle = '#b8bec8'; ctx.lineWidth = 2;
    for (let i = -6; i <= 6; i++) { ctx.beginPath(); ctx.moveTo(200 + i * 20, 0); ctx.quadraticCurveTo(200 + i * 45, 60, 200 + i * 70, 120); ctx.stroke(); }
    for (let y = 20; y < 120; y += 25) { ctx.beginPath(); ctx.ellipse(200, -40, 260, y + 40, 0, 0.1, Math.PI - 0.1); ctx.stroke(); }
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(30 + i * 42, 104 + Math.abs(i - 4) * 3, 4, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#23407a'; ctx.fillRect(0, 118, W, FENCE - 118);
    drawStands(120, FENCE - 22, ['#3b64b0', '#ffd400', '#fff', '#2c4f95']);
    ctx.fillStyle = '#1f4e9c'; ctx.fillRect(0, FENCE - 20, W, 20);
    ctx.fillStyle = '#ffd400'; ctx.fillRect(0, FENCE - 20, W, 3);
    return fieldColors('#3cb35a', '#35a653', '#a0663d', true);
  }
  // major
  const g = ctx.createLinearGradient(0, 0, 0, FENCE);
  g.addColorStop(0, '#4aa3e8'); g.addColorStop(1, '#bfe3fb');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, FENCE);
  // 遠くのビル
  ctx.fillStyle = '#9fb3c6';
  for (let i = 0; i < 9; i++) ctx.fillRect(i * 46, 70 - (i * 13) % 40, 30, 60);
  // 大きなスコアボード
  ctx.fillStyle = '#123b27'; ctx.fillRect(110, 30, 180, 72);
  ctx.fillStyle = '#e8e8e8'; ctx.fillRect(110, 26, 180, 6);
  ctx.fillStyle = '#ffe066'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('1 2 3 4 5 6 7 8 9  R', 200, 52);
  ctx.fillStyle = '#fff'; ctx.fillText('0 0 1 0 2 0 0 0 -  3', 200, 72);
  ctx.fillText('0 1 0 0 0 0 1 0 -  2', 200, 90);
  ctx.fillStyle = '#1f5a3a'; ctx.fillRect(0, 108, W, FENCE - 108);
  drawStands(112, FENCE - 22, ['#1f5a3a', '#fff', '#c33', '#2d6fb3', '#ffd400']);
  // れんがのフェンス
  ctx.fillStyle = '#8b3a2a'; ctx.fillRect(0, FENCE - 20, W, 20);
  ctx.strokeStyle = '#6b2a1e'; ctx.lineWidth = 1;
  for (let y = FENCE - 20; y < FENCE; y += 5) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    for (let x = (y % 10 ? 0 : 6); x < W; x += 12) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 5); ctx.stroke(); }
  }
  // 旗
  for (const x of [20, 380]) { ctx.fillStyle = '#ddd'; ctx.fillRect(x, 110, 2, 30); ctx.fillStyle = '#c33'; ctx.fillRect(x + 2, 110, 14, 9); }
  return fieldColors('#3f9a45', '#4aad50', '#b5794a', true);
}
function fieldColors(grass, grass2, dirt, stripes) { return { grass, grass2, dirt, stripes }; }

function drawField(c) {
  const FENCE = 232;
  ctx.fillStyle = c.grass; ctx.fillRect(0, FENCE, W, H - FENCE);
  if (c.stripes) {
    ctx.fillStyle = c.grass2;
    for (let i = 0; i < 10; i += 2) {
      const y0 = FENCE + i * 12 + i * i * 4, y1 = FENCE + (i + 1) * 12 + (i + 1) * (i + 1) * 4;
      ctx.fillRect(0, y0, W, y1 - y0);
    }
  }
  const B1 = { x: 322, y: 450 }, B2 = { x: 200, y: 318 }, B3 = { x: 78, y: 450 };
  // 内野の土
  ctx.fillStyle = c.dirt;
  ctx.beginPath(); ctx.ellipse(200, 460, 175, 190, 0, Math.PI, 0); ctx.lineTo(375, 700); ctx.lineTo(25, 700); ctx.fill();
  // 内野の芝
  ctx.fillStyle = c.grass;
  ctx.beginPath(); ctx.moveTo(HOME.x, HOME.y - 30); ctx.lineTo(B1.x - 28, B1.y); ctx.lineTo(B2.x, B2.y + 22); ctx.lineTo(B3.x + 28, B3.y); ctx.closePath(); ctx.fill();
  // ファウルライン
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(HOME.x, HOME.y); ctx.lineTo(HOME.x + (B1.x - HOME.x) * 3, HOME.y + (B1.y - HOME.y) * 3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(HOME.x, HOME.y); ctx.lineTo(HOME.x + (B3.x - HOME.x) * 3, HOME.y + (B3.y - HOME.y) * 3); ctx.stroke();
  // マウンド
  ctx.fillStyle = c.dirt; ctx.beginPath(); ctx.ellipse(MOUND.x, MOUND.y, 34, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(MOUND.x - 7, MOUND.y - 2, 14, 3);
  // ベース（塁にランナーがいたら黄色）
  const bs = [B1, B2, B3];
  bs.forEach((b, i) => {
    ctx.fillStyle = bases && bases[i] ? '#ffd400' : '#fff';
    ctx.beginPath(); ctx.moveTo(b.x, b.y - 6); ctx.lineTo(b.x + 9, b.y); ctx.lineTo(b.x, b.y + 6); ctx.lineTo(b.x - 9, b.y); ctx.fill();
  });
  // バッターボックスとホームベース
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;
  ctx.strokeRect(HOME.x - 110, HOME.y - 40, 70, 90);
  ctx.strokeRect(HOME.x + 40, HOME.y - 40, 70, 90);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(HOME.x - 22, HOME.y - 8); ctx.lineTo(HOME.x + 22, HOME.y - 8); ctx.lineTo(HOME.x + 22, HOME.y + 4); ctx.lineTo(HOME.x, HOME.y + 16); ctx.lineTo(HOME.x - 22, HOME.y + 4); ctx.fill();
}

// ===== 描画：人 =====
function drawPitcher() {
  const x = MOUND.x, y = MOUND.y;
  let arm = -0.6;
  if (state === 'windup') { const k = 1 - Math.max(0, (pitchAt - now()) / 700); arm = -0.6 - k * 2.2; }
  else if (state === 'pitch' && now() - pitchAt < 180) arm = 1.2;
  ctx.fillStyle = '#bfc5cf'; ctx.fillRect(x - 5, y - 28, 10, 16);       // からだ
  ctx.fillStyle = '#6b7380'; ctx.fillRect(x - 5, y - 12, 4, 12); ctx.fillRect(x + 1, y - 12, 4, 12); // あし
  ctx.fillStyle = '#e8c39e'; ctx.beginPath(); ctx.arc(x, y - 33, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2d3b55'; ctx.fillRect(x - 6, y - 39, 12, 4);        // ぼうし
  ctx.strokeStyle = '#bfc5cf'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x + 4, y - 25); ctx.lineTo(x + 4 + Math.sin(arm) * 12, y - 25 - Math.cos(arm) * 12); ctx.stroke();
}
function drawBatter() {
  // 右バッター（キャッチャーから見て左側）。縦じまのユニフォーム
  const x = 130, y = 650;
  ctx.fillStyle = '#f4f4f0'; ctx.fillRect(x - 16, y - 60, 14, 60); ctx.fillRect(x + 2, y - 60, 14, 60);  // あし
  ctx.fillStyle = '#111'; ctx.fillRect(x - 18, y - 6, 18, 8); ctx.fillRect(x + 2, y - 6, 18, 8);          // くつ
  ctx.fillStyle = '#f4f4f0'; ctx.beginPath(); ctx.roundRect(x - 22, y - 128, 44, 72, 8); ctx.fill();      // からだ
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;
  for (let sx = x - 18; sx < x + 22; sx += 7) { ctx.beginPath(); ctx.moveTo(sx, y - 125); ctx.lineTo(sx, y - 3); ctx.stroke(); }
  ctx.fillStyle = '#ffd400'; ctx.fillRect(x - 22, y - 62, 44, 5);        // ベルトのライン
  ctx.fillStyle = '#e8c39e'; ctx.beginPath(); ctx.arc(x + 2, y - 140, 13, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x, y - 143, 15, Math.PI, 0); ctx.fill(); ctx.fillRect(x - 15, y - 145, 34, 6); // ヘルメット
  // バット
  let ang = -2.3;
  if (swung && swingAt) { const k = Math.min(1, (now() - swingAt) / 140); ang = -2.3 + k * 2.7; }
  const hx = x + 22, hy = y - 100;
  ctx.strokeStyle = '#c8955b'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + Math.cos(ang) * 95, hy + Math.sin(ang) * 95); ctx.stroke();
  ctx.fillStyle = '#e8c39e'; ctx.beginPath(); ctx.arc(hx, hy, 6, 0, Math.PI * 2); ctx.fill();
}

// ===== 描画：ボール =====
// 投げた球の位置（p=0 投げた瞬間、p=1 ベースに届く）。変化球は後半に曲がる・落ちる
function ballPos(p) {
  const q = Math.min(1, p);
  return {
    x: BALL_FROM.x + (BALL_TO.x - BALL_FROM.x) * p + (pitch.curve + pitch.bx) * q * q,
    y: BALL_FROM.y + (BALL_TO.y - BALL_FROM.y) * p + pitch.drop * q * q * q + pitch.by * q * q,
    r: 3 + 10 * q,
  };
}
function drawBall() {
  let x, y, r;
  if (state === 'pitch' || (state === 'result' && !flight && swung && pitch)) {
    const p = Math.min(1.25, (now() - pitchAt) / pitch.dur);
    if (state === 'result' && p >= 1.25) return;
    ({ x, y, r } = ballPos(p));
  } else if (state === 'result' && flight) {
    const k = Math.min(1, (now() - flight.at) / 1100);
    const sx = flight.sx, sy = flight.sy;
    if (flight.kind === 'hr') { x = sx + flight.dir * 150 * k; y = sy - 520 * k + 120 * k * k; r = 12 - 10 * k; }
    else if (flight.kind === 'hit') { x = sx + flight.dir * 170 * k; y = sy - 330 * k + 90 * k * k; r = 12 - 8 * k; }
    else { x = sx + flight.dir * 260 * k; y = sy - 150 * k + 40 * k * k; r = 12 - 4 * k; }
    if (r < 1) return;
  } else return;
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(x, Math.max(y + r + 4, y + 8), r * 0.8, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#d33'; ctx.lineWidth = Math.max(1, r / 7);
  ctx.beginPath(); ctx.arc(x - r * 0.9, y, r * 0.7, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(x + r * 0.9, y, r * 0.7, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
}

// ===== 描画：文字と表示 =====
function text(s, x, y, size, color, align = 'center') {
  ctx.font = `bold ${size}px "Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineJoin = 'round';
  ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.roundRect(10, 10, 130, 96, 8); ctx.fill();
  text(`得点 ${score}`, 20, 28, 18, '#ffd400', 'left');
  const rows = [['B', balls, 3, '#4cd964'], ['S', strikes, 2, '#ffd400'], ['O', outs, 2, '#ff5252']];
  rows.forEach(([label, n, max, col], r) => {
    const y = 52 + r * 20;
    text(label, 22, y, 13, '#fff', 'left');
    for (let i = 0; i < max; i++) { ctx.fillStyle = i < n ? col : '#555'; ctx.beginPath(); ctx.arc(46 + i * 16, y, 6, 0, Math.PI * 2); ctx.fill(); }
  });
  // 小さなダイヤモンド（ランナー）
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.roundRect(W - 90, 10, 80, 62, 8); ctx.fill();
  const pts = [[W - 30, 44], [W - 50, 24], [W - 70, 44]];
  pts.forEach(([x, y], i) => {
    ctx.fillStyle = bases[i] ? '#ffd400' : '#555';
    ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x + 8, y); ctx.lineTo(x, y + 8); ctx.lineTo(x - 8, y); ctx.fill();
  });
  text(`ベスト ${best}`, W - 50, 62, 11, '#fff');
  // 球種と球速（投げたあとに表示）
  if ((state === 'pitch' || state === 'result') && pitch)
    text(`${pitch.name}  ${pitch.kmh}km/h`, W / 2, 262, 14, '#fff');
}

function draw() {
  const fc = drawBackground();
  // ホームランの一瞬の光
  drawField(fc);
  drawPitcher();
  // うっすらストライクゾーン（この枠を通る球がストライク）
  if (state !== 'title') {
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
    ctx.strokeRect(160, 505, 80, 75); ctx.setLineDash([]);
  }
  drawBall();
  drawBatter();
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 1.2);
    ctx.fillStyle = `hsl(${p.hue},100%,60%)`; ctx.fillRect(p.x, p.y, 3, 3);
  }
  ctx.globalAlpha = 1;
  if (flashAt && now() - flashAt < 250) { ctx.fillStyle = `rgba(255,255,220,${0.5 * (1 - (now() - flashAt) / 250)})`; ctx.fillRect(0, 0, W, H); }

  if (state === 'title') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
    text('タテジマ', W / 2, 190, 52, '#ffd400');
    text('バッティング', W / 2, 250, 44, '#fff');
    text('ボールがベースに来た瞬間に', W / 2, 330, 18, '#fff');
    text('タップ（スペース）でスイング', W / 2, 356, 18, '#fff');
    text('3アウトまでに何点とれるか', W / 2, 392, 16, '#fff');
    text('枠の外に来るボール球は、見送ろう', W / 2, 418, 15, '#9fe39f');
    if (Math.floor(t * 2) % 2 === 0) text('タップしてプレイボール', W / 2, 470, 22, '#ffe066');
    if (best) text(`ベスト ${best}点`, W / 2, 520, 16, '#fff');
    return;
  }
  drawHUD();
  if (state === 'windup' && pitchNo === 0) text(`今日の球場：${STADIUM_NAME[stadium]}`, W / 2, 200, 18, '#fff');
  if (state === 'result' && msg) {
    text(msg, W / 2, 170, msg.length > 5 ? 36 : 42, msgColor);
    if (subMsg) text(subMsg, W / 2, 214, 18, '#fff');
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    text('ゲームセット', W / 2, 220, 42, '#ffd400');
    text(`${score}点`, W / 2, 290, 48, '#fff');
    if (score >= best && score > 0) text('ベスト更新！', W / 2, 345, 22, '#ff9f43');
    text(`球場：${STADIUM_NAME[stadium]}`, W / 2, 390, 16, '#fff');
    text('タップでもう一回（球場も変わるよ）', W / 2, 450, 18, '#fff');
  }
}

// ===== ループ =====
let last = now();
function loop(n) {
  const dt = Math.min(0.033, (n - last) / 1000); last = n;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
